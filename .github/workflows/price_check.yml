name: B&H MacBook Price Check

on:
  # Runs every day at 09:00 UTC.
  # Automatically skips if no products in products.json have "active": true.
  schedule:
    - cron: "0 9 * * *"

  # Allows manual trigger from the GitHub Actions UI
  # Use the price_override input to simulate a price drop and test notifications
  workflow_dispatch:
    inputs:
      price_override:
        description: "Simulate a price (e.g. 2499.00) to test alerts. Leave blank for a real live check."
        required: false
        default: ""

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for active products
        id: check_active
        run: |
          count=$(jq '[.[] | select(.active == true)] | length' products.json)
          if [ "$count" -gt 0 ]; then
            echo "has_active=true" >> $GITHUB_OUTPUT
            echo "✅ $count active product(s) found — proceeding."
          else
            echo "has_active=false" >> $GITHUB_OUTPUT
            echo "⏭️  No active products in products.json — skipping run."
          fi

      - name: Set up Python 3.12
        if: steps.check_active.outputs.has_active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check_active.outputs.has_active == 'true'
        run: pip install -r requirements.txt

      - name: Run price check
        if: steps.check_active.outputs.has_active == 'true'
        env:
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Only set when manually triggered with an override value
          PRICE_OVERRIDE: ${{ inputs.price_override }}
        run: python check_prices.py
