name: B&H MacBook Price Check

on:
  # Daily cron DISABLED — MacBook tracking is currently paused (all products active: false).
  # To re-enable: uncomment the two lines below and set products active: true in products.json.
  # schedule:
  #   - cron: "0 9 * * *"

  # Manual trigger still available for ad-hoc checks or testing
  workflow_dispatch:
    inputs:
      price_override:
        description: "Simulate a price (e.g. 2499.00) to test alerts. Leave blank for a real live check."
        required: false
        default: ""

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Only set when manually triggered with an override value
          PRICE_OVERRIDE: ${{ inputs.price_override }}
        run: python check_prices.py
