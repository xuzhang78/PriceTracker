name: Price & Deal Tracker

on:
  # Runs daily at 10:00 UTC (6:00 AM EDT).
  # Each tracker type is only executed if it has at least one active entry
  # in tracker_config.json — no wasted runner minutes otherwise.
  schedule:
    - cron: "0 10 * * *"

  # Manual trigger — supports isolated testing of each tracker.
  workflow_dispatch:
    inputs:
      run_tracker:
        description: "Which tracker to run (auto = respect active flags in tracker_config.json)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - dealmoon
          - bh
          - both
      include_expired:
        description: "Dealmoon: set 'true' to include expired deals (E2E pipeline test)"
        required: false
        default: "false"
      price_override:
        description: "B&H: simulate a price drop (e.g. 2499.00). Leave blank for live check."
        required: false
        default: ""

jobs:
  run-trackers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check for active trackers
        id: check_active
        run: |
          override="${{ inputs.run_tracker || 'auto' }}"

          if [ "$override" = "dealmoon" ] || [ "$override" = "both" ]; then
            dm_flag=true
          elif [ "$override" = "bh" ]; then
            dm_flag=false
          else
            # auto: respect active flags in tracker_config.json
            count=$(jq '[.trackers[] | select(.type == "dealmoon_bogo" and .active == true)] | length' tracker_config.json)
            [ "$count" -gt 0 ] && dm_flag=true || dm_flag=false
          fi

          if [ "$override" = "bh" ] || [ "$override" = "both" ]; then
            bh_flag=true
          elif [ "$override" = "dealmoon" ]; then
            bh_flag=false
          else
            count=$(jq '[.trackers[] | select(.type == "bh_price" and .active == true)] | length' tracker_config.json)
            [ "$count" -gt 0 ] && bh_flag=true || bh_flag=false
          fi

          echo "dealmoon_active=$dm_flag" >> $GITHUB_OUTPUT
          echo "bh_active=$bh_flag"       >> $GITHUB_OUTPUT
          echo "run_tracker=$override | dealmoon=$dm_flag | bh=$bh_flag"

      - uses: actions/setup-python@v6
        if: steps.check_active.outputs.dealmoon_active == 'true' || steps.check_active.outputs.bh_active == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check_active.outputs.dealmoon_active == 'true' || steps.check_active.outputs.bh_active == 'true'
        run: pip install -r requirements.txt

      - name: Run Dealmoon BOGO check
        if: steps.check_active.outputs.dealmoon_active == 'true'
        env:
          SGAI_API_KEY:      ${{ secrets.SGAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          INCLUDE_EXPIRED:   ${{ inputs.include_expired || 'false' }}
        run: python check_deals.py

      - name: Run B&H price check
        if: steps.check_active.outputs.bh_active == 'true'
        env:
          SGAI_API_KEY:   ${{ secrets.SGAI_API_KEY }}
          NTFY_TOPIC:     ${{ secrets.NTFY_TOPIC }}
          PRICE_OVERRIDE: ${{ inputs.price_override }}
        run: python check_prices.py
