name: Price & Deal Tracker

on:
  # Runs daily at 10:00 UTC (6:00 AM EDT).
  # All tracker jobs start simultaneously. Each job gates itself — if it has
  # nothing active in tracker_config.json, it exits after checkout with no cost.
  schedule:
    - cron: "0 10 * * *"

  # Manual trigger — use run_tracker to target a specific subagent job.
  workflow_dispatch:
    inputs:
      run_tracker:
        description: "Which tracker to run (auto = respect active flags in tracker_config.json)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - dealmoon
          - prices
          - both
      include_expired:
        description: "Dealmoon: set 'true' to include expired deals (E2E pipeline test)"
        required: false
        default: "false"
      price_override:
        description: "Prices: simulate a price drop (e.g. 1299.00). Leave blank for live check."
        required: false
        default: ""
      report_mode:
        description: "Prices: set 'true' to do real extraction and always notify with actual price (pipeline verification)"
        required: false
        default: "false"

# ── Subagent: Dealmoon BOGO ────────────────────────────────────────────────────
jobs:
  dealmoon:
    name: "Dealmoon BOGO Check"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tracker == 'auto' || inputs.run_tracker == 'dealmoon' || inputs.run_tracker == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Gate — skip if not targeted or no active brands
        id: gate
        run: |
          override="${{ inputs.run_tracker || 'auto' }}"

          if [ "$override" = "prices" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  Skipped — run_tracker=prices"
            exit 0
          fi

          if [ "$override" = "dealmoon" ] || [ "$override" = "both" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Targeted by run_tracker=$override"
            exit 0
          fi

          count=$(jq '[.trackers[] | select(.type == "dealmoon_bogo" and .active == true)] | length' tracker_config.json)
          if [ "$count" -gt 0 ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ $count active Dealmoon brand(s) found — proceeding"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  No active dealmoon_bogo entries — skipping"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run Dealmoon BOGO check
        if: steps.gate.outputs.skip != 'true'
        env:
          SGAI_API_KEY:      ${{ secrets.SGAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          INCLUDE_EXPIRED:   ${{ inputs.include_expired || 'false' }}
          TESTING:           ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python check_deals.py

# ── Subagent: Price Check (B&H + iPhone) ───────────────────────────────────────
  prices:
    name: "Price Check"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tracker == 'auto' || inputs.run_tracker == 'prices' || inputs.run_tracker == 'both' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Gate — skip if not targeted or no active products
        id: gate
        run: |
          override="${{ inputs.run_tracker || 'auto' }}"

          if [ "$override" = "dealmoon" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  Skipped — run_tracker=dealmoon"
            exit 0
          fi

          if [ "$override" = "prices" ] || [ "$override" = "both" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Targeted by run_tracker=$override"
            exit 0
          fi

          count=$(jq '[.trackers[] | select((.type == "bh_price" or .type == "iphone_price") and .active == true)] | length' tracker_config.json)
          if [ "$count" -gt 0 ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ $count active price tracker product(s) found — proceeding"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  No active price tracker entries — skipping"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run price check
        if: steps.gate.outputs.skip != 'true'
        env:
          SGAI_API_KEY:      ${{ secrets.SGAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          PRICE_OVERRIDE:    ${{ inputs.price_override }}
          REPORT_MODE:       ${{ inputs.report_mode || 'false' }}
          TESTING:           ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python check_prices.py
