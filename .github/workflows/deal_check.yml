name: Dealmoon BOGO Daily Check

on:
  schedule:
    - cron: "0 10 * * *"   # Runs daily at 10:00 UTC
  workflow_dispatch:
    inputs:
      include_expired:
        description: "Set to 'true' to include expired deals for real-data E2E pipeline testing"
        required: false
        default: "false"

jobs:
  check-deals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BOGO deal check
        env:
          SGAI_API_KEY:       ${{ secrets.SGAI_API_KEY }}
          FIRECRAWL_API_KEY:  ${{ secrets.FIRECRAWL_API_KEY }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          INCLUDE_EXPIRED:    ${{ inputs.include_expired || 'false' }}
        run: python check_deals.py
